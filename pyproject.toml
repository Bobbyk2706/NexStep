[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexstep"
version = "0.1.0"
description = "AI-Powered Exam Eligibility and Tracking Platform"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Web API
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.52,<1.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",

    # Validation / Configuration
    "pydantic>=2.13,<3.0",
    "email-validator>=2.0,<3.0",
    "python-dotenv>=1.2,<2.0",

    # HTTP / Web Discovery
    "requests>=2.32,<3.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.15,<5.0",
    "tavily-python>=0.8.4",

    # PDF Processing
    "pymupdf>=1.28,<2.0",

    # Authentication / Security
    "bcrypt>=4.0,<6.0",
    "python-jose[cryptography]>=3.5,<4.0",

    # AI Providers
    "openai>=1.0,<3.0",
    "groq>=1.7.0",
    "ollama>=0.6.2",

    # Scheduling
    "apscheduler>=3.11.3",

    # Testing
    "pytest>=9.0,<10.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
