[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexstep"
version = "0.1.0"
description = "AI-Powered Exam Eligibility and Tracking Platform"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.52,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.13,<3.0",
    "python-dotenv>=1.2,<2.0",
    "requests>=2.32,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]